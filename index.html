<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>夜曲 Op.72 No.1</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      height: 100vh;
      background: linear-gradient(to bottom, #0a0e1a, #000000);
      color: #d0d8ff;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .player {
      width: 340px;
      max-width: 90%;
      padding: 40px 25px;
      background: rgba(15, 20, 40, 0.9);
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0,0,20,0.8);
    }
    .controls {
      text-align: center;
      margin-bottom: 25px;
    }
    button {
      width: 80px;
      height: 80px;
      border: none;
      border-radius: 50%;
      background: #1e2a50;
      color: #e0e8ff;
      font-size: 32px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    }
    button:hover { background: #2e3a70; transform: scale(1.08); }
    button:disabled { opacity: 0.5; cursor: not-allowed; background: #1e2a50; }
    .progress-container {
      height: 8px;
      background: #222;
      border-radius: 4px;
      margin: 20px 0;
      cursor: pointer;
      overflow: hidden;
    }
    .progress {
      height: 100%;
      width: 0%;
      background: linear-gradient(to right, #6a9fff, #a0c0ff);
      border-radius: 4px;
      transition: width 0.12s linear;
    }
    .time {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #90a0ff;
      margin-bottom: 20px;
    }
    .volume {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .volume span {
      font-size: 14px;
      min-width: 45px;
      color: #a0b0ff;
    }
    input[type=range] {
      -webkit-appearance: none;
      height: 6px;
      background: #333;
      border-radius: 3px;
      outline: none;
      flex: 1;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      background: #a0c0ff;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(160,192,255,0.6);
    }
    input[type=range]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      background: #a0c0ff;
      border: none;
      border-radius: 50%;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="player">
  <div class="controls">
    <button id="btn" disabled>▶</button>
  </div>

  <div class="progress-container" id="progContainer">
    <div class="progress" id="prog"></div>
  </div>

  <div class="time">
    <span id="curr">--:--</span>
    <span id="dur">--:--</span>
  </div>

  <div class="volume">
    <span>音量</span>
    <input type="range" id="vol" min="0" max="1" step="0.01" value="0.8">
  </div>
</div>

<audio id="audio" preload="metadata" loop>
   <source src="Nocturne in E minor, Op. posth. 72.mp3" type="audio/mpeg">
  你的浏览器不支持音频。
</audio>

<script>
  const audio = document.getElementById('audio');
  const btn = document.getElementById('btn');
  const progContainer = document.getElementById('progContainer');
  const prog = document.getElementById('prog');
  const curr = document.getElementById('curr');
  const dur = document.getElementById('dur');
  const vol = document.getElementById('vol');

  // 音量记忆
  const savedVol = localStorage.getItem('nocturneVol');
  if (savedVol !== null) {
    vol.value = savedVol;
    audio.volume = parseFloat(savedVol);
  }

  function fmt(t) {
    if (isNaN(t) || !t) return '--:--';
    const m = Math.floor(t / 60);
    const s = Math.floor(t % 60);
    return `${m}:${s.toString().padStart(2, '0')}`;
  }

  audio.addEventListener('loadedmetadata', () => {
    dur.textContent = fmt(audio.duration);
    btn.disabled = false;
  });

  audio.addEventListener('timeupdate', () => {
    if (!audio.duration) return;
    const percent = (audio.currentTime / audio.duration) * 100;
    prog.style.width = `${percent}%`;
    curr.textContent = fmt(audio.currentTime);
  });

  progContainer.addEventListener('click', e => {
    if (!audio.duration) return;
    const rect = progContainer.getBoundingClientRect();
    const pos = (e.clientX - rect.left) / rect.width;
    audio.currentTime = pos * audio.duration;
  });

  btn.addEventListener('click', () => {
    if (audio.paused) {
      audio.play().catch(() => {});
      btn.textContent = '❚❚';
    } else {
      audio.pause();
      btn.textContent = '▶';
    }
  });

  vol.addEventListener('input', () => {
    audio.volume = vol.value;
    localStorage.setItem('nocturneVol', vol.value);
  });

  audio.addEventListener('ended', () => {
    btn.textContent = '▶';
  });

  audio.addEventListener('error', () => {
    btn.disabled = true;
    btn.textContent = '加载失败';
  });
</script>

</body>
</html>
